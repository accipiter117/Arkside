<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arkside: Operative Creator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dde1e0; --surface:#f1f3f2; --surface2:#e3e7e6; --ink:#1a2226; --muted:#56626a; --line:#c4cccb;
  --chip:#fbfcfc; --chip-ink:#20292e; --deep:#24313a;
  --accent:#c9581c; --on-accent:#ffffff;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11181c; --surface:#182126; --surface2:#212c32; --ink:#e4eaec; --muted:#93a1a8; --line:#2b383f;
    --chip:#1d272d; --chip-ink:#dfe6e8; --deep:#0b1114; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11181c; --surface:#182126; --surface2:#212c32; --ink:#e4eaec; --muted:#93a1a8; --line:#2b383f;
  --chip:#1d272d; --chip-ink:#dfe6e8; --deep:#0b1114; color-scheme:dark;
}
body[data-faction="security"]{--accent:#2a7fbd}
body[data-faction="resistance"]{--accent:#c9581c}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.45 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{max-width:1140px;margin:0 auto;padding:0 12px 48px;display:grid;gap:14px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 10px}
@media (min-width:880px){
  .app{grid-template-columns:430px 1fr;align-items:start;padding-top:18px}
  .top{top:calc(env(safe-area-inset-top,0px) + 12px);padding-top:0}
}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.brand h1{font-family:'Teko','Arial Narrow',sans-serif;font-weight:600;font-size:30px;line-height:.9;margin:0;letter-spacing:.01em}
.brand h1 small{display:block;font-family:'Barlow',sans-serif;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0;margin-top:3px}
.actions{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--chip-ink);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px;min-height:38px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{padding:5px 9px;min-height:32px;font-size:13px}

.stage{position:relative;height:clamp(250px,40vh,400px);border-radius:6px 22px 6px 6px;overflow:hidden;background:#0f2133;border:1px solid rgba(0,0,0,.25)}
@media (min-width:880px){.stage{height:auto;aspect-ratio:4/5}}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);color:#fff;padding:7px 11px 6px;background:rgba(8,12,15,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-left:4px solid var(--accent);border-radius:2px 8px 8px 2px}
.tname{font-family:'Teko','Arial Narrow',sans-serif;font-size:27px;line-height:.85;font-weight:500}
.tcs{font-size:12.5px;opacity:.85}
.trole{font-size:12px;opacity:.75;margin-top:1px}
.zoom{position:absolute;top:10px;right:10px;border:0;border-radius:8px;background:rgba(8,12,15,.6);color:#fff;padding:6px 10px;font-size:13px;font-weight:600}
.editing{position:absolute;top:10px;left:10px;display:none;align-items:center;gap:6px;background:var(--accent);color:#fff;border-radius:8px;padding:4px 4px 4px 10px;font-size:13px;font-weight:600}
.editing.on{display:flex}
.editing button{border:0;background:rgba(0,0,0,.2);color:#fff;border-radius:6px;width:24px;height:24px;line-height:1}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:9px 2px 0}
.stat .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px}
.stat .lab b{color:var(--ink);font-weight:600}
.bar{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s ease}

.tabs{display:flex;gap:2px;margin-top:10px;background:var(--surface2);border-radius:10px;padding:3px}
.tabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 4px;font-family:'Teko','Arial Narrow',sans-serif;font-size:20px;line-height:1;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 14px 6px}
.group{margin-bottom:22px}
.group h3{font-family:'Teko','Arial Narrow',sans-serif;font-weight:500;font-size:23px;line-height:1;margin:0 0 9px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.group h3 small{font-family:'Barlow',sans-serif;font-size:12.5px;font-weight:400;color:var(--muted);text-align:right}
.note{font-size:13.5px;color:var(--muted);margin:8px 0 0;max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--chip-ink);border-radius:8px;padding:7px 12px;font-weight:500;font-size:14px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.card{text-align:left;border:1px solid var(--line);background:var(--chip);color:var(--chip-ink);border-radius:8px;padding:9px 11px 10px}
.card b{display:block;font-family:'Teko','Arial Narrow',sans-serif;font-weight:500;font-size:22px;line-height:1}
.card span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--chip))}
.swatches{display:flex;flex-wrap:wrap;gap:9px}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid rgba(0,0,0,.18);padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.field input{width:100%;border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:8px 10px;min-height:40px;font-weight:500}

.squad{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:1000px){.squad{grid-template-columns:repeat(4,1fr)}}
.slot{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--chip);display:flex;flex-direction:column}
.slot.on{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.thumb{height:150px;position:relative}
.thumb.security{background:linear-gradient(#0f2133,#35617f)}
.thumb.resistance{background:linear-gradient(#1f120d,#8a4220)}
.thumb.empty{background:repeating-linear-gradient(135deg,var(--surface2) 0 10px,var(--surface) 10px 20px);display:grid;place-items:center;color:var(--muted);font-size:13px}
.thumb svg{width:100%;height:100%;display:block}
.sinfo{padding:7px 9px 2px}
.sinfo b{display:block;font-family:'Teko','Arial Narrow',sans-serif;font-weight:500;font-size:21px;line-height:1}
.sinfo span{font-size:12.5px;color:var(--muted)}
.sbtn{display:flex;flex-wrap:wrap;gap:5px;padding:7px 9px 9px;margin-top:auto}
details{margin-top:4px}
summary{cursor:pointer;font-weight:600;font-size:14px;padding:4px 0}
textarea{width:100%;min-height:110px;border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:8px;font-size:12px;margin:8px 0}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--deep);color:#fff;padding:10px 16px;border-radius:10px;font-weight:500;font-size:14px;transition:opacity .2s,transform .2s;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.bar i,.toast{transition:none}}
</style>
</head>
<body data-faction="resistance">
<div class="app">
  <section class="top">
    <div class="brand">
      <h1>Arkside<small>Operative creator</small></h1>
      <div class="actions">
        <button class="btn" id="rand" type="button">Randomise</button>
        <button class="btn primary" id="save" type="button">Save to squad</button>
      </div>
    </div>
    <div class="stage">
      <svg id="pv" viewBox="0 0 200 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Operative preview"></svg>
      <div class="editing" id="editing"><span id="editingTxt"></span><button type="button" id="stopEdit" aria-label="Stop editing this slot">✕</button></div>
      <button class="zoom" id="zoom" type="button">Face</button>
      <div class="tag" id="tag"></div>
    </div>
    <div class="stats" id="stats"></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </section>
  <main class="panel" id="panel"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Data ---------- */
const FACTIONS={
  security:{label:'Security',accent:'#2a7fbd',blurb:'Keep the Ark’s last resources under control, whatever it takes.',
    pal:['#2b3d55','#4a5e73','#d4d9dc','#22272c','#6c8ca6','#8b9196'],names:['Navy','Slate','Ice','Black','Steel','Concrete']},
  resistance:{label:'Resistance',accent:'#c9581c',blurb:'An equal share of the water, and a way to reach the outside world.',
    pal:['#7a3c22','#8b7b55','#525c3b','#5a4636','#a5462f','#2e2b28'],names:['Rust','Khaki','Olive','Mud','Brick','Soot']}
};
const SKIN=['#f2d3b8','#e3b691','#c99067','#a7704b','#7c4f33','#55351f'];
const HAIRC=['#1a1613','#3a2618','#6a4226','#a5722f','#d9b76c','#9b9a96','#ece6da','#a62d2d','#2e6e8e'];
const BODY={
  light:{label:'Light',hp:80,move:7,agil:3,fire:1,trav:'wall-hops, vents and rooftops',
    sh:29,wa:19,hip:21,leg:11,arm:8,neck:7,shY:104,waistY:166,hipY:178,kneeY:228,footY:284,headY:73},
  medium:{label:'Medium',hp:110,move:5,agil:2,fire:2,trav:'climbs ledges to head height',
    sh:37,wa:26,hip:26,leg:13.5,arm:10.5,neck:9,shY:106,waistY:168,hipY:180,kneeY:229,footY:284,headY:74},
  heavy:{label:'Heavy',hp:150,move:4,agil:1,fire:3,trav:'vaults waist-high cover only',
    sh:50,wa:40,hip:34,leg:17,arm:14,neck:13,shY:110,waistY:172,hipY:184,kneeY:232,footY:284,headY:79}
};
const CLASSES={
  soldier:{label:'Soldier',abil:'Breach charges, ammo resupply, grenades',desc:'Blows open sealed objectives and keeps the squad stocked with ammo.'},
  medic:{label:'Medic',abil:'Revive, patch up, adrenaline boost',desc:'Gets downed allies back on their feet and is the only class that can self-revive.'},
  engineer:{label:'Engineer',abil:'Build cover and turrets, repair, disarm',desc:'Fortifies positions, repairs objectives and upgrades the squad’s armour.'},
  operative:{label:'Operative',abil:'Hack, disguise, recon',desc:'Hacks terminals, wears the enemy’s uniform and spots hidden mines.'}
};
const WEAPONS={
  mpistol:{label:'Machine pistol',bodies:['light'],fore:.45},
  smg:{label:'SMG',bodies:['light','medium'],fore:.85},
  rifle:{label:'Assault rifle',bodies:['medium','heavy'],fore:1},
  shotgun:{label:'Shotgun',bodies:['medium','heavy'],fore:1},
  lmg:{label:'LMG',bodies:['heavy'],fore:1},
  minigun:{label:'Minigun',bodies:['heavy'],fore:.75}
};
const OPTS={
  face:[['long','Long'],['square','Square'],['angular','Angular'],['broad','Broad']],
  expr:[['neutral','Neutral'],['grim','Grim'],['smirk','Smirk'],['snarl','Snarl']],
  facial:[['none','Clean shaven'],['stubble','Stubble'],['moustache','Moustache'],['goatee','Goatee'],['chops','Mutton chops'],['beard','Full beard']],
  mark:[['none','None'],['scar','Scar'],['tattoo','Face tattoo'],['paint','War paint'],['patch','Eye patch']],
  hair:[['shaved','Shaved'],['buzz','Buzz cut'],['crop','Crop'],['mohawk','Mohawk'],['spiky','Spiky'],['slick','Slicked'],['topknot','Top knot'],['dreads','Dreads']],
  headgear:[['none','None'],['beanie','Beanie'],['cap','Cap'],['bandana','Bandana'],['helmet','Combat helmet'],['riothelm','Riot helmet','security'],['headset','Headset'],['goggles','Goggles']],
  facegear:[['none','None'],['mask','Bandana mask'],['respirator','Respirator'],['shades','Shades'],['hud','HUD visor']],
  top:[['tee','T-shirt'],['tank','Tank top'],['long','Long sleeve'],['hoodie','Hoodie'],['jacket','Jacket']],
  armour:[['none','None','No bonus'],['rig','Chest rig','+5 health'],['carrier','Plate carrier','+10 health'],['riot','Riot armour','+25 health, −1 move','security'],['scrap','Scrap armour','+15 health','resistance']],
  legs:[['cargo','Cargo'],['armoured','Armoured'],['jeans','Jeans']],
  gloves:[['none','None'],['fingerless','Fingerless'],['tactical','Tactical']]
};
const ARMOUR_MOD={none:{hp:0,move:0},rig:{hp:5,move:0},carrier:{hp:10,move:0},riot:{hp:25,move:-1},scrap:{hp:15,move:0}};
const FACES={long:{rx:15,ry:23,j:.6},square:{rx:17,ry:21,j:.86},angular:{rx:16,ry:22,j:.42},broad:{rx:19,ry:20,j:.92}};
const COVER=new Set(['beanie','cap','bandana','helmet','riothelm']);
const NAMES=['Kestrel','Rook','Mako','Juno','Brask','Vex','Tamsin','Okoro','Dace','Halloran','Ines','Petra','Silas','Wren','Yusuf','Moss','Ada','Corin','Bex','Tavi'];
const CALLSIGNS=['Undertow','Bilge Rat','Breakwater','Gull','Saltwater','Rivet','Static','Ghost Tide','Ballast','Riptide','Barnacle','Lighthouse','Floodgate','Drydock','Squall'];
const DEFAULT={name:'Kestrel',callsign:'Undertow',faction:'resistance',body:'medium',cls:'soldier',weapon:'rifle',skin:2,face:'square',expr:'grim',facial:'stubble',mark:'none',hair:'buzz',hairCol:1,headgear:'none',facegear:'none',top:'tee',armour:'rig',legs:'cargo',gloves:'fingerless',primary:0,secondary:1};

/* ---------- Helpers ---------- */
const $=q=>document.querySelector(q);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const lerp=(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const t=p<0?0:255,f=Math.abs(p)/100;r=Math.round(r+(t-r)*f);g=Math.round(g+(t-g)*f);b=Math.round(b+(t-b)*f);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
const OL='#17140f';
const RC='fill="none" stroke-linecap="round" stroke-linejoin="round"';
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function clean(o){const s={...DEFAULT};if(o&&typeof o==='object'){for(const k in DEFAULT){if(k in o&&typeof o[k]===typeof DEFAULT[k])s[k]=o[k]}}
  if(!FACTIONS[s.faction])s.faction=DEFAULT.faction;if(!BODY[s.body])s.body=DEFAULT.body;if(!CLASSES[s.cls])s.cls=DEFAULT.cls;if(!FACES[s.face])s.face=DEFAULT.face;
  for(const k of ['expr','facial','mark','hair','headgear','facegear','top','armour','legs','gloves']){if(!OPTS[k].some(x=>x[0]===s[k]))s[k]=DEFAULT[k]}
  s.skin=Math.min(SKIN.length-1,Math.max(0,s.skin|0));s.hairCol=Math.min(HAIRC.length-1,Math.max(0,s.hairCol|0));s.primary=Math.min(5,Math.max(0,s.primary|0));s.secondary=Math.min(5,Math.max(0,s.secondary|0));
  s.name=String(s.name).slice(0,18);s.callsign=String(s.callsign).slice(0,22);return normalize(s)}
function normalize(s){
  const ok=Object.keys(WEAPONS).filter(w=>WEAPONS[w].bodies.includes(s.body));
  if(!ok.includes(s.weapon))s.weapon=s.body==='heavy'?'minigun':s.body==='light'?'smg':'rifle';
  for(const key of ['headgear','armour']){const o=OPTS[key].find(x=>x[0]===s[key]);const fac=key==='armour'?o&&o[3]:o&&o[2];if(fac&&fac!==s.faction)s[key]=key==='armour'?'carrier':'helmet'}
  return s;
}

/* ---------- Drawing ---------- */
function backdrop(s,p){
  const c=s.faction==='security'?{t:'#0f2133',m:'#35617f',g:'#cfe7f3',sea:'#0d2333',tw:'#0a1622',lt:'#9fd3ef'}:{t:'#1f120d',m:'#8a4220',g:'#ffcf88',sea:'#1c1f24',tw:'#160d09',lt:'#ffb35c'};
  const acc=FACTIONS[s.faction].accent;
  let h=`<defs><linearGradient id="${p}sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.t}"/><stop offset=".7" stop-color="${c.m}"/><stop offset="1" stop-color="${c.g}"/></linearGradient><radialGradient id="${p}gl"><stop offset="0" stop-color="${c.g}" stop-opacity=".85"/><stop offset="1" stop-color="${c.g}" stop-opacity="0"/></radialGradient></defs>`;
  h+=`<rect x="-400" y="-200" width="1000" height="445" fill="url(#${p}sky)"/><circle cx="150" cy="236" r="80" fill="url(#${p}gl)"/>`;
  h+=`<ellipse cx="-30" cy="245" rx="80" ry="46" fill="${c.tw}" opacity=".6"/>`;
  const T=[[-150,160,26],[-110,128,18],[-60,150,22],[-28,118,16],[8,168,14],[28,96,20],[56,140,12],[138,112,18],[162,150,14],[184,86,24],[214,158,16],[238,124,20],[266,142,18],[300,110,22],[330,150,18]];
  for(const [x,y,w] of T){
    h+=`<rect x="${x}" y="${y}" width="${w}" height="${245-y}" fill="${c.tw}" opacity=".72"/><path d="M${x+w/2} ${y} V${y-14}" stroke="${c.tw}" stroke-width="1.3" opacity=".72"/>`;
    for(let yy=y+6;yy<238;yy+=9)for(let xx=x+3;xx<x+w-3;xx+=5){if(((xx*7+yy*13)%5+5)%5===0)h+=`<rect x="${xx}" y="${yy}" width="1.7" height="2.4" fill="${c.lt}" opacity=".6"/>`}
  }
  h+=`<rect x="-400" y="243" width="1000" height="200" fill="${c.sea}"/><rect x="-400" y="243" width="1000" height="1.2" fill="${c.g}" opacity=".5"/>`;
  for(const [x,y] of [[-40,252],[20,258],[70,250],[130,262],[180,254],[240,260],[-90,262]])h+=`<path d="M${x} ${y} q5 -2 10 0 t10 0" stroke="${c.g}" stroke-width="1" opacity=".25" fill="none"/>`;
  h+=`<rect x="-400" y="277" width="1000" height="200" fill="#232528"/><rect x="-400" y="275" width="1000" height="3" fill="#47494d"/>`;
  for(let x=-200;x<420;x+=14)h+=`<path d="M${x} 279 h7 l-4 6 h-7 Z" fill="${acc}" opacity=".75"/>`;
  return h;
}

function weaponSvg(t,d,fur,acc){
  const M1='#2b2e32',M2='#464b51';
  const r=(x,y,w,h,f,rr=1.5)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rr}" fill="${f}"/>`;
  const grip=`<path d="M1 4 L8 4 L6.5 15 L-.5 14 Z" fill="${M1}"/>`;
  switch(t){
    case 'rifle':return `<path d="M-30 -2 L-4 -5 L-4 6 L-30 11 Z" fill="${fur}"/><path d="M${d*.25} 5 L${d*.25+9} 5 L${d*.25+13} 21 L${d*.25+4} 22 Z" fill="${M1}"/>`+grip+r(-4,-6,d*.55+8,11,M2)+r(d*.5,-5,d*.5+16,9,fur)+r(d+16,-2,20,4,M1,.5)+r(d+34,-3,6,6,M1,1)+r(d*.12,-11,15,5,M1,1);
    case 'smg':return `<path d="M-6 -2 H-22 V5 H-6" fill="none" stroke-width="1.8"/>`+r(d*.28,4,7,22,M1,1)+grip+r(-6,-6,d*.8+10,11,M2)+r(d*.8+3,-4,14,7,M1,1)+r(d*.8+15,-3.5,20,6,M1,2.5)+r(d*.3,-9,8,3,acc,.5);

  if(fg==='hud')a(`<path d="M${cx-rx-1} ${eyeY-3.5} H${cx+rx+1} V${eyeY+2.5} H${cx-rx-1} Z" fill="#38e0ff" opacity=".42" stroke="#38e0ff" stroke-width=".8"/><rect x="${cx+rx-1}" y="${eyeY-4.5}" width="4" height="8" rx="1" fill="#25292d"/><path d="M${cx-rx+2} ${eyeY-1} h5 M${cx+3} ${eyeY+1} h4" stroke="#e8fbff" stroke-width=".8" opacity=".8"/>`);
  if(s.cls==='operative'&&hg!=='headset'&&hg!=='riothelm')a(`<path d="M${cx+rx+2} ${hy-1} L${cx+rx+6} ${hy-ry*.95}" stroke="#25292d" stroke-width="1.2"/><circle cx="${cx+rx+6}" cy="${hy-ry*.95}" r="1.4" fill="#38e0ff"/><rect x="${cx+rx-1}" y="${hy-2}" width="4.5" height="7" rx="1.5" fill="#25292d" stroke="${OL}" stroke-width=".8"/>`);
  return o.join('');
}

/* ---------- State ---------- */
let S=clean(load('arkside.draft.v1')||DEFAULT);
let squad=(load('arkside.squad.v1')||[null,null,null,null]).slice(0,4).map(m=>m?clean(m):null);
while(squad.length<4)squad.push(null);
let editing=null,tab='role',zoomHead=false,vb=[0,0,200,300],vbAnim=0,lastTarget='';
const TABS=[['role','Role'],['face','Face'],['hair','Hair'],['gear','Gear'],['squad','Squad']];

/* ---------- UI builders ---------- */
const chips=(key,title,list,hint='')=>`<div class="group"><h3>${title}${hint?`<small>${hint}</small>`:''}</h3><div class="chips">${list.map(([id,l])=>`<button type="button" class="chip" data-k="${key}" data-v="${id}" aria-pressed="${S[key]===id}">${l}</button>`).join('')}</div></div>`;
const cards=(key,title,list,hint='',extra='')=>`<div class="group"><h3>${title}${hint?`<small>${hint}</small>`:''}</h3><div class="cards">${list.map(([id,l,sub])=>`<button type="button" class="card" data-k="${key}" data-v="${id}" aria-pressed="${S[key]===id}"><b>${l}</b><span>${sub}</span></button>`).join('')}</div>${extra}</div>`;
const swatches=(key,title,cols,names=[])=>`<div class="group"><h3>${title}${names.length?`<small>${names[S[key]]}</small>`:''}</h3><div class="swatches">${cols.map((c,i)=>`<button type="button" class="sw" style="background:${c}" data-k="${key}" data-v="${i}" data-n="1" aria-pressed="${S[key]===i}" aria-label="${names[i]||'Colour '+(i+1)}"></button>`).join('')}</div></div>`;
const facOk=o=>!o||o===S.faction;

function buildTabs(){
  $('#tabs').innerHTML=TABS.map(([id,l])=>`<button type="button" role="tab" data-tab="${id}" aria-selected="${tab===id}">${l}</button>`).join('');
}
function buildPanel(){
  let h='';const F=FACTIONS[S.faction];
  if(tab==='role'){
    h+=`<div class="group fields"><label class="field"><span>Name</span><input id="nm" maxlength="18" autocomplete="off" value="${esc(S.name)}"></label><label class="field"><span>Callsign</span><input id="cs" maxlength="22" autocomplete="off" value="${esc(S.callsign)}"></label></div>`;
    h+=cards('faction','Faction',Object.entries(FACTIONS).map(([id,f])=>[id,f.label,f.blurb]));
    h+=cards('body','Body type',Object.entries(BODY).map(([id,b])=>[id,b.label,`${b.hp} health, move ${b.move}, ${b.trav}`]),'Fixed once deployed');
    h+=cards('cls','Class',Object.entries(CLASSES).map(([id,c])=>[id,c.label,c.abil]),'Swappable at command posts',`<p class="note">${CLASSES[S.cls].desc}</p>`);
    h+=chips('weapon','Primary weapon',Object.entries(WEAPONS).filter(([,w])=>w.bodies.includes(S.body)).map(([id,w])=>[id,w.label]),`What a ${BODY[S.body].label.toLowerCase()} build can carry`);
  }
  if(tab==='face'){
    h+=swatches('skin','Skin tone',SKIN);
    h+=chips('face','Face shape',OPTS.face);
    h+=chips('expr','Expression',OPTS.expr);
    h+=chips('facial','Facial hair',OPTS.facial);
    h+=chips('mark','Markings',OPTS.mark);
  }
  if(tab==='hair'){
    h+=chips('hair','Hairstyle',OPTS.hair,COVER.has(S.headgear)?'Mostly hidden by headgear':'');
    h+=swatches('hairCol','Hair colour',HAIRC,['Black','Dark brown','Brown','Copper','Blonde','Grey','White','Red dye','Blue dye']);
    h+=chips('headgear','Headgear',OPTS.headgear.filter(o=>facOk(o[2])),S.faction==='security'?'Riot helmet is Security issue':'');
    h+=chips('facegear','Face gear',OPTS.facegear);
  }
  if(tab==='gear'){
    h+=chips('top','Top',OPTS.top);
    h+=cards('armour','Armour',OPTS.armour.filter(o=>facOk(o[3])).map(o=>[o[0],o[1],o[2]]),`${F.label} exclusive included`);
    h+=chips('legs','Trousers',OPTS.legs);
    h+=chips('gloves','Gloves',OPTS.gloves);
    h+=swatches('primary','Main colour',F.pal,F.names);
    h+=swatches('secondary','Second colour',F.pal,F.names);
  }
  if(tab==='squad'){
    const filled=squad.filter(Boolean);
    const have=new Set(filled.map(m=>m.cls));
    const missing=Object.keys(CLASSES).filter(c=>!have.has(c)).map(c=>CLASSES[c].label);
    h+=`<div class="group"><h3>Squad<small>${filled.length} of 4 operatives</small></h3><div class="squad">`;
    squad.forEach((m,i)=>{
      if(m)h+=`<div class="slot${editing===i?' on':''}"><div class="thumb ${m.faction}"><svg viewBox="20 40 160 252" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${render(m,'t'+i,false)}</svg></div><div class="sinfo"><b>${esc(m.name||'Unnamed')}</b><span>${BODY[m.body].label} ${CLASSES[m.cls].label.toLowerCase()}, ${FACTIONS[m.faction].label}</span></div><div class="sbtn"><button type="button" class="btn small" data-act="edit" data-i="${i}">Edit</button><button type="button" class="btn small" data-act="put" data-i="${i}">Replace</button><button type="button" class="btn small" data-act="clear" data-i="${i}">Remove</button></div></div>`;
      else h+=`<div class="slot"><div class="thumb empty">Slot ${i+1} empty</div><div class="sbtn"><button type="button" class="btn small primary" data-act="put" data-i="${i}">Save current here</button></div></div>`;
    });
    h+=`</div>`;
    if(filled.length)h+=`<p class="note">${missing.length?`No ${missing.join(' or ')} yet. A balanced squad covers every class.`:'Every class covered. Nicely balanced.'}${new Set(filled.map(m=>m.faction)).size>1?' Mixed factions in one squad, which the Ark would call treason.':''}</p>`;
    h+=`</div><div class="group"><details><summary>Export or import squad</summary><p class="note">Saved squads live in this browser only. Copy the code below to move a squad to another device.</p><textarea id="io" spellcheck="false"></textarea><div class="sbtn" style="padding:0"><button type="button" class="btn small" data-act="export">Show export code</button><button type="button" class="btn small" data-act="import">Import code</button></div></details></div>`;
  }
  $('#panel').innerHTML=h;
}

function targetVB(){
  if(!zoomHead)return [0,0,200,300];
  const hy=BODY[S.body].headY;return [56,hy-50,88,104];
}
function setVB(t,instant){
  cancelAnimationFrame(vbAnim);const pv=$('#pv');
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(instant||reduce){vb=t.slice();pv.setAttribute('viewBox',vb.join(' '));return}
  const from=vb.slice(),t0=performance.now();
  const step=now=>{const k=Math.min(1,(now-t0)/300),e=1-Math.pow(1-k,3);vb=from.map((v,i)=>v+(t[i]-v)*e);pv.setAttribute('viewBox',vb.map(v=>v.toFixed(2)).join(' '));if(k<1)vbAnim=requestAnimationFrame(step)};
  vbAnim=requestAnimationFrame(step);
}

function update(){
  document.body.dataset.faction=S.faction;
  $('#pv').innerHTML=render(S,'pv',true);
  const t=targetVB(),key=t.join(',');if(key!==lastTarget){setVB(t,!lastTarget);lastTarget=key}
  $('#zoom').textContent=zoomHead?'Full body':'Face';
  const B=BODY[S.body],am=ARMOUR_MOD[S.armour],hp=B.hp+am.hp,mv=B.move+am.move;
  $('#tag').innerHTML=`<div class="tname">${esc(S.name||'Unnamed')}</div>${S.callsign?`<div class="tcs">“${esc(S.callsign)}”</div>`:''}<div class="trole">${B.label} ${CLASSES[S.cls].label.toLowerCase()}, ${WEAPONS[S.weapon].label.toLowerCase()}</div>`;
  const st=[['Health',hp,hp/175],['Move',mv,mv/7],['Agility',B.agil,B.agil/3],['Firepower',B.fire,B.fire/3]];
  $('#stats').innerHTML=st.map(([l,v,f])=>`<div class="stat"><div class="lab">${l}<b>${v}</b></div><div class="bar"><i style="width:${Math.round(f*100)}%"></i></div></div>`).join('');
  $('#editing').classList.toggle('on',editing!==null);
  $('#editingTxt').textContent=editing!==null?`Editing slot ${editing+1}`:'';
  $('#save').textContent=editing!==null?`Save slot ${editing+1}`:'Save to squad';
  store('arkside.draft.v1',S);
}

let toastT=0;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}
function persist(){store('arkside.squad.v1',squad)}

/* ---------- Events ---------- */
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;
  zoomHead=(tab==='face'||tab==='hair');buildTabs();buildPanel();update()});
$('#zoom').addEventListener('click',()=>{zoomHead=!zoomHead;update()});
$('#panel').addEventListener('click',e=>{
  const b=e.target.closest('[data-k]');
  if(b){const k=b.dataset.k;S[k]=b.dataset.n?parseInt(b.dataset.v,10):b.dataset.v;normalize(S);buildPanel();update();return}
  const act=e.target.closest('[data-act]');if(!act)return;
  const i=parseInt(act.dataset.i,10),a=act.dataset.act;
  if(a==='edit'){S=clean(squad[i]);editing=i;tab='role';zoomHead=false;buildTabs();buildPanel();update();toast(`Editing slot ${i+1}`)}
  if(a==='put'){squad[i]=clean(S);editing=i;persist();buildPanel();update();toast(`Saved to slot ${i+1}`)}
  if(a==='clear'){const n=squad[i]&&squad[i].name;squad[i]=null;if(editing===i)editing=null;persist();buildPanel();update();toast(`${n||'Operative'} removed from the squad`)}
  if(a==='export'){const io=$('#io');io.value=JSON.stringify(squad);io.focus();io.select();toast('Export code ready to copy')}
  if(a==='import'){try{const arr=JSON.parse($('#io').value);if(!Array.isArray(arr))throw 0;squad=[0,1,2,3].map(j=>arr[j]?clean(arr[j]):null);editing=null;persist();buildPanel();update();toast('Squad imported')}catch(err){toast('That code isn’t a valid squad export. Paste the full code and try again.')}}
});
$('#panel').addEventListener('input',e=>{if(e.target.id==='nm'){S.name=e.target.value;update()}if(e.target.id==='cs'){S.callsign=e.target.value;update()}});
$('#stopEdit').addEventListener('click',()=>{editing=null;if(tab==='squad')buildPanel();update();toast('Changes now save to a new slot')});
$('#save').addEventListener('click',()=>{
  const i=editing!==null?editing:squad.findIndex(m=>!m);
  if(i<0){tab='squad';zoomHead=false;buildTabs();buildPanel();update();toast('The squad’s full. Replace someone or remove them first.');return}
  squad[i]=clean(S);editing=i;persist();if(tab==='squad')buildPanel();update();toast(`${S.name||'Operative'} saved to slot ${i+1}`);
});
$('#rand').addEventListener('click',()=>{
  const f=pick(Object.keys(FACTIONS)),b=pick(Object.keys(BODY));
  const ids=k=>OPTS[k].filter(o=>{const fac=k==='armour'?o[3]:o[2];return !fac||fac===f}).map(o=>o[0]);
  const r={faction:f,body:b,cls:pick(Object.keys(CLASSES)),weapon:pick(Object.keys(WEAPONS).filter(w=>WEAPONS[w].bodies.includes(b))),
    skin:Math.floor(Math.random()*SKIN.length),face:pick(ids('face')),expr:pick(ids('expr')),facial:pick(ids('facial')),mark:Math.random()<.55?'none':pick(ids('mark')),
    hair:pick(ids('hair')),hairCol:Math.random()<.85?Math.floor(Math.random()*7):7+Math.floor(Math.random()*2),headgear:Math.random()<.35?'none':pick(ids('headgear')),
    facegear:Math.random()<.6?'none':pick(ids('facegear')),top:pick(ids('top')),armour:pick(ids('armour')),legs:pick(ids('legs')),gloves:pick(ids('gloves')),
    primary:Math.floor(Math.random()*6),secondary:Math.floor(Math.random()*6),name:pick(NAMES),callsign:pick(CALLSIGNS)};
  S=clean(r);buildPanel();update();
});

buildTabs();buildPanel();update();
</script>
</body>
</html>
