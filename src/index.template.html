<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c9581c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arkside">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Arkside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<style>/*__CSS__*/</style>
</head>
<body data-view="title" data-faction="resistance">
<section id="v-title" class="page"></section>
<section id="v-camp" class="page" hidden></section>
<section id="v-roster" class="page" hidden></section>
<section id="v-brief" class="page" hidden></section>
<section id="v-debrief" class="page" hidden></section>
<section id="v-creator" class="page" hidden></section>
<section id="v-game" hidden>
  <div id="stage"><div id="hud"></div>
    <div id="objMark" hidden><i></i><span></span></div>
    <button type="button" id="objPill" class="glass" aria-label="Objectives"><span class="turns" id="turn"></span><span class="ot"><small id="objStage"></small><b id="obj"></b></span></button>
    <button type="button" id="menuBtn" class="hb round" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
    <button type="button" id="mapBtn" class="hb" aria-label="Minimap" data-tip="mini"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m15 5-6-2-6 2v16l6-2 6 2 6-2V3l-6 2Zm-1 13.7-4-1.3V5.3l4 1.3v12.1Z"/></svg></button>
    <button type="button" id="rotR" class="hb round" aria-label="Rotate camera"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></svg></button>
    <div id="roster" class="rail"></div>
    <div id="toasts" role="status" aria-live="polite"></div>
    <button type="button" id="undoBtn" class="glass" data-tip="undo" hidden>↶ Undo move</button>
    <div id="banner"></div>
    <div id="miniWrap" class="glass" hidden><canvas id="mini" aria-label="Minimap"></canvas><small>Tap the map to look there</small></div>
    <div id="detail"></div>
    <div id="sheet" hidden></div>
  </div>
  <div id="menuSheet" hidden><div class="msheet"><div class="grab"></div><small class="kick">Mission</small><b id="mtitle"></b>
    <div class="mrow"><button type="button" class="btn pri" id="menuClose">Resume</button><button type="button" class="btn" id="spd">Speed</button><button type="button" class="btn" id="snd">Sound</button><button type="button" class="btn warn" id="retreat">Retreat</button></div>
    <small class="kick">Messages</small><ol id="logList"></ol></div></div>
</section>
<div id="toast" role="status" aria-live="polite"></div>
<div id="tip" role="tooltip" hidden></div>
<div id="modal" hidden></div>
<script>
if(typeof THREE==='undefined'){document.body.insertAdjacentHTML('afterbegin','<p style="padding:20px;text-align:center">The 3D engine couldn’t load. Check your connection and reload.</p>')}
</script>

</body>
</html>
