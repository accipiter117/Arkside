<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arkside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>:root{--bg:#e4e1db;--panel:#f4f2ee;--panel2:#e6e2da;--ink:#1c2125;--muted:#5d646a;--line:#cdc7bc;--acc:#c9581c;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101417;--panel:#171c20;--panel2:#20272c;--ink:#e6eaec;--muted:#98a3aa;--line:#2b353b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101417;--panel:#171c20;--panel2:#20272c;--ink:#e6eaec;--muted:#98a3aa;--line:#2b353b;color-scheme:dark}
body[data-faction="security"]{--acc:#2a7fbd}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body[data-view="game"]{overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
.page{max-width:760px;margin:0 auto;padding:16px 14px 40px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;font-weight:600;min-height:40px}
.btn.ghost{background:transparent}.btn.warn{color:#c8321f}
.go{border:0;background:var(--acc);color:#fff;font-weight:600;font-size:16px;border-radius:10px;padding:12px 16px;min-height:48px;width:100%}
.go:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row .go{flex:1}
.small{font-size:13px;color:var(--muted)}
.bar{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}
.vh{font-family:Teko,'Arial Narrow',sans-serif;font-weight:600;font-size:38px;line-height:.95;margin:6px 0 10px}.vh small{display:block;font-size:17px;font-weight:500;color:var(--muted)}
h3{font-family:Teko,sans-serif;font-weight:500;font-size:24px;margin:18px 0 8px}
/* title */
.hero-art{margin:-16px -14px 0;height:170px;overflow:hidden;border-radius:0 0 18px 18px}.hero-art svg,.camp-art svg{width:100%;height:100%;display:block}
.camp-art{margin:-16px -14px 12px;height:110px;overflow:hidden;border-radius:0 0 14px 14px}
.title-hero{padding:16px 4px 18px}.title-hero h1{font-family:Teko,'Arial Narrow',sans-serif;font-weight:600;font-size:64px;line-height:.85;margin:0}.title-hero p{color:var(--muted);margin:6px 0 0;font-size:16px}
.facs{display:grid;gap:12px}
.fac{border:0;border-radius:6px 22px 6px 6px;padding:18px 16px 16px;text-align:left;color:#fff;min-height:132px;display:flex;flex-direction:column;justify-content:flex-end}
.fac.resistance{background:linear-gradient(140deg,#c9581c,#5a2a17 75%)}.fac.security{background:linear-gradient(140deg,#2a7fbd,#152a40 75%)}
.fac b{font-family:Teko,sans-serif;font-weight:600;font-size:40px;line-height:.9}.fac span{opacity:.9;margin-top:4px}.fac em{font-style:normal;font-size:12.5px;opacity:.8;margin-top:8px}
.tools{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tools summary{font-weight:600;cursor:pointer}
textarea{width:100%;min-height:90px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px;font:12px ui-monospace,monospace;margin:8px 0}
/* campaign */
.missions{display:grid;gap:10px}
.mis{position:relative;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 12px 12px 58px;min-height:70px}
.mis em{position:absolute;left:12px;top:12px;width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-style:normal;font-family:Teko,sans-serif;font-size:22px;padding-top:2px}
.mis b{display:block;font-family:Teko,sans-serif;font-weight:500;font-size:24px;line-height:1}.mis span{color:var(--muted);font-size:13px;display:block}.mis small{display:block;font-size:11.5px;color:var(--muted);opacity:.8;margin-top:2px}
.mis i{position:absolute;right:12px;top:10px;font-style:normal;font-size:15px;font-weight:600;color:#d99a1a;letter-spacing:1px}
.mis.locked{opacity:.5}.mis.locked em{background:var(--muted)}.mis.done em{background:#2c9d68}
.epi{background:var(--panel);border-left:4px solid var(--acc);border-radius:8px;padding:12px 14px;margin-bottom:12px}.epi b{font-family:Teko,sans-serif;font-size:24px;font-weight:500}.epi p{margin:4px 0}
/* cards */
.pf{width:64px;height:64px;border-radius:8px;overflow:hidden;flex:none;background:linear-gradient(#2a1a17,#5a2a26)}
body[data-faction="security"] .pf{background:linear-gradient(#13263a,#35617f)}
.pf svg{width:100%;height:100%;display:block}
.oc{min-width:0;flex:1}.oc b{display:block;font-family:Teko,sans-serif;font-weight:500;font-size:22px;line-height:1}.oc b i{font-style:normal;font-size:15px;color:var(--acc);margin-left:4px}
.oc span{display:block;font-size:12.5px;color:var(--muted)}
.xp{height:4px;background:var(--panel2);border-radius:2px;margin-top:5px;overflow:hidden}.xp s{display:block;height:100%;background:var(--acc)}
.st{margin:5px 0 0;font-size:12.5px}.st em{font-style:normal;color:#c8321f;font-weight:600}
.plist,.rlist,.dlist{display:grid;gap:8px}
@media(min-width:620px){.plist,.dlist{grid-template-columns:1fr 1fr}}
.pk,.rcard,.dcard,.recruit{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px}
.pk.on{border-color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}.pk:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.chip{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 9px;font-size:13px;text-transform:capitalize;min-height:32px}.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.ab{margin:7px 0 0;display:flex;flex-wrap:wrap;gap:5px}.ab span{font-size:12px;background:var(--panel2);border-radius:6px;padding:2px 7px}.ab span.lk{opacity:.55}
.story p{margin:0 0 10px;font-size:15px;line-height:1.5;max-width:62ch}
.objline{background:var(--panel);border-left:4px solid var(--acc);padding:8px 12px;border-radius:6px}
.sticky{position:sticky;bottom:0;padding:12px 0 calc(4px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.lvup{margin:5px 0 0;font-size:12.5px;font-weight:600;color:#2c9d68}
.recruit{margin-top:12px;border-color:var(--acc)}.recruit b{font-family:Teko,sans-serif;font-weight:500;font-size:22px;display:block;line-height:1}.recruit span{font-size:13px;color:var(--muted);text-transform:capitalize}
#v-debrief .row{margin-top:14px}
/* game */
#v-game{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
#top{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#retreat{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 8px;font-size:12.5px;min-height:36px}
.mission{flex:1;min-width:0}.mission b{display:block;font-family:Teko,sans-serif;font-weight:500;font-size:21px;line-height:1}
.mission span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#turn{font-family:Teko,sans-serif;font-size:17px;color:var(--muted)}
#endTurn{border:0;background:var(--acc);color:#fff;font-weight:600;border-radius:8px;padding:8px 11px;min-height:38px}#endTurn:disabled{opacity:.45}
#stage{position:relative;flex:1;min-height:0;background:linear-gradient(#2f86cf,#7fbbe2 45%,#cfe5ef 80%);overflow:hidden}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ub{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap}
.ub i{display:block;width:34px;height:4px;background:rgba(0,0,0,.55);border-radius:2px;overflow:hidden}
.ub b{display:block;height:100%;background:#e8823e;transition:width .3s}.ub.e b{background:#4aa3e0}
body[data-faction="security"] .ub.p b{background:#4aa3e0}body[data-faction="security"] .ub.e b{background:#e8823e}
.ub.down span{opacity:.6}.ub.down b{background:#777}
.tg{position:absolute;left:0;top:0;background:#c8321f;color:#fff;font-weight:700;font-size:12px;padding:2px 6px;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.4);text-align:center;line-height:1.1}
.tg small{display:block;font-size:9px;font-weight:600;opacity:.9}
.pop{position:absolute;transform:translate(-50%,-100%);font-family:Teko,sans-serif;font-size:23px;font-weight:600;color:#ffd27a;text-shadow:0 2px 3px #000;animation:pop 1.1s ease-out forwards;white-space:nowrap}
.pop.hurt{color:#ff6b5a}.pop.miss{color:#ddd}.pop.good{color:#7dffb0}
@keyframes pop{0%{opacity:0;margin-top:6px}15%{opacity:1}100%{opacity:0;margin-top:-34px}}
.camctl{position:absolute;right:10px;top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.camctl button{width:40px;height:40px;border:0;border-radius:10px;background:rgba(10,12,14,.6);color:#fff;font-size:18px}#spd{font-family:Teko,sans-serif;font-size:20px}
#banner{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);font-family:Teko,sans-serif;font-size:42px;font-weight:600;color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.7);opacity:0;pointer-events:none;white-space:nowrap}
#banner.show{animation:ban 1.4s ease forwards}#banner.enemy{color:#ffd0a0}
@keyframes ban{0%{opacity:0;letter-spacing:.2em}20%{opacity:1;letter-spacing:.02em}75%{opacity:1}100%{opacity:0}}
#undoBtn{position:absolute;left:10px;top:10px;border:0;border-radius:10px;background:#fff;color:#1c2125;font-weight:700;font-size:14px;padding:9px 13px;min-height:42px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
#log{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);background:rgba(10,12,14,.7);color:#fff;font-size:13px;padding:6px 10px;border-radius:8px;opacity:0;pointer-events:none}
#log.show{animation:lg 3.4s ease forwards}@keyframes lg{0%{opacity:0}8%{opacity:1}82%{opacity:1}100%{opacity:0}}
#panel{background:var(--panel);border-top:1px solid var(--line);padding:8px 10px 10px}
#roster{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ro{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:5px 6px 6px;text-align:left;min-height:40px;min-width:0}
.ro b{display:block;font-family:Teko,sans-serif;font-weight:500;font-size:17px;line-height:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ro i{display:block;height:4px;background:rgba(0,0,0,.18);border-radius:2px;margin-top:3px;overflow:hidden}.ro s{display:block;height:100%;background:var(--acc)}
.ro.on{border-color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}.ro.done{opacity:.55}.ro.dn b{text-decoration:line-through}
#detail{margin-top:7px;min-height:104px}
.dtop b{font-family:Teko,sans-serif;font-weight:500;font-size:21px;line-height:1;margin-right:5px}.dtop span{color:var(--muted);font-size:12px}
.dstat{display:flex;gap:5px;margin:3px 0;flex-wrap:wrap}.dstat span{font-size:11.5px;background:var(--panel2);border-radius:6px;padding:2px 7px}.dstat span.used{text-decoration:line-through;opacity:.55}
.hint{margin:2px 0 6px;font-size:12px;color:var(--muted)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.act{flex:none;border:1px solid var(--acc);background:var(--acc);color:#fff;font-weight:600;border-radius:8px;padding:7px 11px;min-height:38px;text-transform:capitalize}
.act.on{background:#ffb347;border-color:#ffb347;color:#1c1209}.act.obj{background:#2c9d68;border-color:#2c9d68}.act.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.act:disabled{opacity:.4}
.lkp{position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;border:2px dashed rgba(255,255,255,.7);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;background:rgba(10,12,14,.45)}
.stars{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:6px 0 10px}.stars b{font-size:28px;color:#d99a1a;letter-spacing:3px}
.stars ul{margin:4px 0 0;padding:0;list-style:none;font-size:13.5px}.stars li{color:var(--muted);padding-left:20px;position:relative}.stars li::before{content:"○";position:absolute;left:2px}.stars li.ok{color:var(--ink)}.stars li.ok::before{content:"✓";color:#2c9d68;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#1c2125;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;transition:.2s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.fail{position:absolute;inset:0;display:grid;place-items:center;color:#eee;padding:20px;text-align:center}
@media (prefers-reduced-motion:reduce){.pop,#banner.show,#log.show{animation-duration:.01s}}
</style>
</head>
<body data-view="title" data-faction="resistance">
<section id="v-title" class="page"></section>
<section id="v-camp" class="page" hidden></section>
<section id="v-roster" class="page" hidden></section>
<section id="v-brief" class="page" hidden></section>
<section id="v-debrief" class="page" hidden></section>
<section id="v-game" hidden>
  <header id="top"><button type="button" id="retreat">Retreat</button><div class="mission"><b id="mtitle"></b><span id="obj"></span></div><span id="turn"></span><button type="button" id="endTurn">End turn</button></header>
  <div id="stage"><div id="hud"></div>
    <div class="camctl"><button type="button" id="rotL" aria-label="Rotate left">⟲</button><button type="button" id="rotR" aria-label="Rotate right">⟳</button><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">−</button><button type="button" id="spd" aria-label="Game speed">1×</button><button type="button" id="snd" aria-label="Sound on or off">🔊</button></div>
    <button type="button" id="undoBtn" hidden>↶ Undo move</button><div id="banner"></div><div id="log" role="status" aria-live="polite"></div></div>
  <footer id="panel"><div id="roster"></div><div id="detail"></div></footer>
</section>
<div id="toast" role="status" aria-live="polite"></div>
<script>
if(typeof THREE==='undefined'){document.body.insertAdjacentHTML('afterbegin','<p style="padding:20px;text-align:center">The 3D engine couldn’t load. Check your connection and reload.</p>')}
</script>
<script>

const FACTIONS={
  security:{label:'Security',accent:'#2a7fbd',blurb:'Keep the Ark’s last resources under control, whatever it takes.',
    pal:['#2b3d55','#4a5e73','#d4d9dc','#22272c','#6c8ca6','#8b9196'],names:['Navy','Slate','Ice','Black','Steel','Concrete']},
  resistance:{label:'Resistance',accent:'#c9581c',blurb:'An equal share of the water, and a way to reach the outside world.',

};
const SKIN=['#f2d3b8','#e3b691','#c99067','#a7704b','#7c4f33','#55351f'];
const HAIRC=['#1a1613','#3a2618','#6a4226','#a5722f','#d9b76c','#9b9a96','#ece6da','#a62d2d','#2e6e8e'];
const BODY={
  light:{label:'Light',hp:80,move:7,agil:3,fire:1,trav:'wall-hops, vents and rooftops',
    sh:29,wa:19,hip:21,leg:11,arm:8,neck:7,shY:104,waistY:166,hipY:178,kneeY:228,footY:284,headY:73},
  medium:{label:'Medium',hp:110,move:5,agil:2,fire:2,trav:'climbs ledges to head height',

  heavy:{label:'Heavy',hp:150,move:4,agil:1,fire:3,trav:'vaults waist-high cover only',
    sh:50,wa:40,hip:34,leg:17,arm:14,neck:13,shY:110,waistY:172,hipY:184,kneeY:232,footY:284,headY:79}
};
const CLASSES={
  soldier:{label:'Soldier',abil:'Breach charges, ammo resupply, grenades',desc:'Blows open sealed objectives and keeps the squad stocked with ammo.'},
  medic:{label:'Medic',abil:'Revive, patch up, adrenaline boost',desc:'Gets downed allies back on their feet and is the only class that can self-revive.'},
  engineer:{label:'Engineer',abil:'Build cover and turrets, repair, disarm',desc:'Fortifies positions, repairs objectives and upgrades the squad’s armour.'},
  operative:{label:'Operative',abil:'Hack, disguise, recon',desc:'Hacks terminals, wears the enemy’s uniform and spots hidden mines.'}
};
const WEAPONS={
  mpistol:{label:'Machine pistol',bodies:['light'],fore:.45},

  lmg:{label:'LMG',bodies:['heavy'],fore:1},
  minigun:{label:'Minigun',bodies:['heavy'],fore:.75}
};
const OPTS={
  face:[['long','Long'],['square','Square'],['angular','Angular'],['broad','Broad']],
  expr:[['neutral','Neutral'],['grim','Grim'],['smirk','Smirk'],['snarl','Snarl']],
  facial:[['none','Clean shaven'],['stubble','Stubble'],['moustache','Moustache'],['goatee','Goatee'],['chops','Mutton chops'],['beard','Full beard']],
  mark:[['none','None'],['scar','Scar'],['tattoo','Face tattoo'],['paint','War paint'],['patch','Eye patch']],
  hair:[['shaved','Shaved'],['buzz','Buzz cut'],['crop','Crop'],['mohawk','Mohawk'],['spiky','Spiky'],['slick','Slicked'],['topknot','Top knot'],['dreads','Dreads']],
  headgear:[['none','None'],['beanie','Beanie'],['cap','Cap'],['bandana','Bandana'],['helmet','Combat helmet'],['riothelm','Riot helmet','security'],['headset','Headset'],['goggles','Goggles']],
  facegear:[['none','None'],['mask','Bandana mask'],['respirator','Respirator'],['shades','Shades'],['hud','HUD visor']],
  top:[['tee','T-shirt'],['tank','Tank top'],['long','Long sleeve'],['hoodie','Hoodie'],['jacket','Jacket']],
  armour:[['none','None','No bonus'],['rig','Chest rig','+5 health'],['carrier','Plate carrier','+10 health'],['riot','Riot armour','+25 health, −1 move','security'],['scrap','Scrap armour','+15 health','resistance']],
  legs:[['cargo','Cargo'],['armoured','Armoured'],['jeans','Jeans']],
  gloves:[['none','None'],['fingerless','Fingerless'],['tactical','Tactical']]
};
const ARMOUR_MOD={none:{hp:0,move:0},rig:{hp:5,move:0},carrier:{hp:10,move:0},riot:{hp:25,move:-1},scrap:{hp:15,move:0}};
const FACES={long:{rx:15,ry:23,j:.6},square:{rx:17,ry:21,j:.86},angular:{rx:16,ry:22,j:.42},broad:{rx:19,ry:20,j:.92}};
const COVER=new Set(['beanie','cap','bandana','helmet','riothelm']);
const NAMES=['Kestrel','Rook','Mako','Juno','Brask','Vex','Tamsin','Okoro','Dace','Halloran','Ines','Petra','Silas','Wren','Yusuf','Moss','Ada','Corin','Bex','Tavi'];
const CALLSIGNS=['Undertow','Bilge Rat','Breakwater','Gull','Saltwater','Rivet','Static','Ghost Tide','Ballast','Riptide','Barnacle','Lighthouse','Floodgate','Drydock','Squall'];
const DEFAULT={name:'Kestrel',callsign:'Undertow',faction:'resistance',body:'medium',cls:'soldier',weapon:'rifle',skin:2,face:'square',expr:'grim',facial:'stubble',mark:'none',hair:'buzz',hairCol:1,headgear:'none',facegear:'none',top:'tee',armour:'rig',legs:'cargo',gloves:'fingerless',primary:0,secondary:1};

/* ---------- Helpers ---------- */
const $=q=>document.querySelector(q);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const lerp=(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const t=p<0?0:255,f=Math.abs(p)/100;r=Math.round(r+(t-r)*f);g=Math.round(g+(t-g)*f);b=Math.round(b+(t-b)*f);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
const OL='#17140f';

function clean(o){const s={...DEFAULT};if(o&&typeof o==='object'){for(const k in DEFAULT){if(k in o&&typeof o[k]===typeof DEFAULT[k])s[k]=o[k]}}
  if(!FACTIONS[s.faction])s.faction=DEFAULT.faction;if(!BODY[s.body])s.body=DEFAULT.body;if(!CLASSES[s.cls])s.cls=DEFAULT.cls;if(!FACES[s.face])s.face=DEFAULT.face;
  for(const k of ['expr','facial','mark','hair','headgear','facegear','top','armour','legs','gloves']){if(!OPTS[k].some(x=>x[0]===s[k]))s[k]=DEFAULT[k]}
  s.skin=Math.min(SKIN.length-1,Math.max(0,s.skin|0));s.hairCol=Math.min(HAIRC.length-1,Math.max(0,s.hairCol|0));s.primary=Math.min(5,Math.max(0,s.primary|0));s.secondary=Math.min(5,Math.max(0,s.secondary|0));
  s.name=String(s.name).slice(0,18);s.callsign=String(s.callsign).slice(0,22);return normalize(s)}
function normalize(s){
  const ok=Object.keys(WEAPONS).filter(w=>WEAPONS[w].bodies.includes(s.body));
  if(!ok.includes(s.weapon))s.weapon=s.body==='heavy'?'minigun':s.body==='light'?'smg':'rifle';
  for(const key of ['headgear','armour']){const o=OPTS[key].find(x=>x[0]===s[key]);const fac=key==='armour'?o&&o[3]:o&&o[2];if(fac&&fac!==s.faction)s[key]=key==='armour'?'carrier':'helmet'}

function backdrop(s,p){
  const c=s.faction==='security'?{t:'#0f2133',m:'#35617f',g:'#cfe7f3',sea:'#0d2333',tw:'#0a1622',lt:'#9fd3ef'}:{t:'#1f120d',m:'#8a4220',g:'#ffcf88',sea:'#1c1f24',tw:'#160d09',lt:'#ffb35c'};
  const acc=FACTIONS[s.faction].accent;
  let h=`<defs><linearGradient id="${p}sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.t}"/><stop offset=".7" stop-color="${c.m}"/><stop offset="1" stop-color="${c.g}"/></linearGradient><radialGradient id="${p}gl"><stop offset="0" stop-color="${c.g}" stop-opacity=".85"/><stop offset="1" stop-color="${c.g}" stop-opacity="0"/></radialGradient></defs>`;
  h+=`<rect x="-400" y="-200" width="1000" height="445" fill="url(#${p}sky)"/><circle cx="150" cy="236" r="80" fill="url(#${p}gl)"/>`;
  h+=`<ellipse cx="-30" cy="245" rx="80" ry="46" fill="${c.tw}" opacity=".6"/>`;
  const T=[[-150,160,26],[-110,128,18],[-60,150,22],[-28,118,16],[8,168,14],[28,96,20],[56,140,12],[138,112,18],[162,150,14],[184,86,24],[214,158,16],[238,124,20],[266,142,18],[300,110,22],[330,150,18]];
  for(const [x,y,w] of T){
    h+=`<rect x="${x}" y="${y}" width="${w}" height="${245-y}" fill="${c.tw}" opacity=".72"/><path d="M${x+w/2} ${y} V${y-14}" stroke="${c.tw}" stroke-width="1.3" opacity=".72"/>`;
    for(let yy=y+6;yy<238;yy+=9)for(let xx=x+3;xx<x+w-3;xx+=5){if(((xx*7+yy*13)%5+5)%5===0)h+=`<rect x="${xx}" y="${yy}" width="1.7" height="2.4" fill="${c.lt}" opacity=".6"/>`}
  }
  h+=`<rect x="-400" y="243" width="1000" height="200" fill="${c.sea}"/><rect x="-400" y="243" width="1000" height="1.2" fill="${c.g}" opacity=".5"/>`;
  for(const [x,y] of [[-40,252],[20,258],[70,250],[130,262],[180,254],[240,260],[-90,262]])h+=`<path d="M${x} ${y} q5 -2 10 0 t10 0" stroke="${c.g}" stroke-width="1" opacity=".25" fill="none"/>`;
  h+=`<rect x="-400" y="277" width="1000" height="200" fill="#232528"/><rect x="-400" y="275" width="1000" height="3" fill="#47494d"/>`;
  for(let x=-200;x<420;x+=14)h+=`<path d="M${x} 279 h7 l-4 6 h-7 Z" fill="${acc}" opacity=".75"/>`;
  return h;
}

function weaponSvg(t,d,fur,acc){
  const M1='#2b2e32',M2='#464b51';
  const r=(x,y,w,h,f,rr=1.5)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rr}" fill="${f}"/>`;
  const grip=`<path d="M1 4 L8 4 L6.5 15 L-.5 14 Z" fill="${M1}"/>`;
  switch(t){
    case 'rifle':return `<path d="M-30 -2 L-4 -5 L-4 6 L-30 11 Z" fill="${fur}"/><path d="M${d*.25} 5 L${d*.25+9} 5 L${d*.25+13} 21 L${d*.25+4} 22 Z" fill="${M1}"/>`+grip+r(-4,-6,d*.55+8,11,M2)+r(d*.5,-5,d*.5+16,9,fur)+r(d+16,-2,20,4,M1,.5)+r(d+34,-3,6,6,M1,1)+r(d*.12,-11,15,5,M1,1);
    case 'smg':return `<path d="M-6 -2 H-22 V5 H-6" fill="none" stroke-width="1.8"/>`+r(d*.28,4,7,22,M1,1)+grip+r(-6,-6,d*.8+10,11,M2)+r(d*.8+3,-4,14,7,M1,1)+r(d*.8+15,-3.5,20,6,M1,2.5)+r(d*.3,-9,8,3,acc,.5);
    case 'mpistol':return r(-1,4,6,22,M1,1)+r(d-2,4,4,8,M1,1)+r(-3,1,d+9,4,M1,1)+r(-4,-5,d+14,7,M2,1.5)+r(d+10,-3.5,4,4,M1,.5);
    case 'shotgun':return `<path d="M-32 -1 L-4 -5 L-4 6 L-32 12 Z" fill="${fur}"/>`+grip+r(-4,-6,d*.45+6,11,M2)+r(d*.45,-5,d*.55+40,4,M1,.5)+r(d*.45,-1,d*.55+34,4,M2,1)+r(d-10,-2,20,8,fur,2)+`<path d="M${d-5} -1 v6 M${d} -1 v6 M${d+5} -1 v6" stroke-width=".9"/>`;
    case 'lmg':{let holes='';for(let x=d*.65;x<d+18;x+=5)holes+=`<circle cx="${x}" cy="-1" r="1.2" fill="#0d0d0d" stroke="none"/>`;
      return `<path d="M-30 -3 L-4 -7 L-4 7 L-30 9 Z" fill="${fur}"/>`+r(d*.15,5,20,16,'#3d4a2d',2)+grip+r(-4,-8,d*.62+8,15,M2,2)+`<path d="M${d*.1} -8 L${d*.15} -14 L${d*.45} -14 L${d*.5} -8" fill="none" stroke-width="2.4"/>`+r(d*.6,-5,d*.4+22,9,M1,1)+holes+r(d+22,-2,18,4,M1,.5)+`<path d="M${d+20} 4 L${d+4} 9 M${d+20} 4 L${d+2} 6" fill="none" stroke-width="1.6"/>`;}
    case 'minigun':{let b='';for(const y of [-7,-1.8,3.4])b+=r(d*.55,y,d*.45+52,3.6,M1,1);
      return `<path d="M${d*.1} 10 Q-6 34 -34 30" fill="none" stroke="#b8933f" stroke-width="6"/><path d="M${d*.1} 10 Q-6 34 -34 30" fill="none" stroke="#6e5420" stroke-width="6" stroke-dasharray="1.5 2.5"/>`+
        `<path d="M-16 -10 H-25 V8 H-16" fill="none" stroke-width="3"/>`+r(-16,-11,d*.55+16,22,M2,4)+r(-10,-7,10,14,M1,2)+b+r(d*.85,-9,5,18,M2,1)+r(d+40,-9,4,18,M2,1)+r(-2,-3,8,6,acc,1)+`<path d="M${d*.1} -11 L${d*.2} -18 L${d*.5} -18 L${d*.55} -11" fill="none" stroke-width="3"/>`;}
  }
  return '';
}

let AC=null,NOISE=null;

function sfx(kind){if(!SAVE.settings.sound)return;const a=ac();if(!a)return;const t=a.currentTime;
  if(!NOISE){NOISE=a.createBuffer(1,a.sampleRate,a.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const noise=(dur,freq,q,vol,type='lowpass')=>{const s=a.createBufferSource();s.buffer=NOISE;const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+dur)};
  const tone=(f0,f1,dur,vol,type='square',dl=0)=>{const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t+dl);o.frequency.exponentialRampToValueAtTime(f1,t+dl+dur);const g=a.createGain();g.gain.setValueAtTime(vol,t+dl);g.gain.exponentialRampToValueAtTime(.001,t+dl+dur);o.connect(g);g.connect(a.destination);o.start(t+dl);o.stop(t+dl+dur)};
  if(kind==='shot'){noise(.12,2400,.7,.3,'bandpass');tone(180,60,.08,.12,'triangle')}
  if(kind==='heavy'){noise(.16,1300,.6,.4,'bandpass');tone(120,40,.12,.18,'triangle')}
  if(kind==='boom'){noise(.9,480,.5,.75);tone(90,30,.6,.35,'sine')}
  if(kind==='hit')tone(320,140,.07,.1,'square');
  if(kind==='miss')noise(.08,5000,1,.07,'highpass');
  if(kind==='ui')tone(880,660,.05,.04,'sine');
  if(kind==='alarm'){tone(660,660,.14,.09,'square');tone(880,880,.14,.09,'square',.17)}
  if(kind==='good'){tone(523,523,.1,.07,'sine');tone(784,784,.15,.07,'sine',.1)}
  if(kind==='win')[523,659,784,1046].forEach((f,i)=>tone(f,f,.25,.07,'triangle',i*.12));
  if(kind==='lose')[392,330,262].forEach((f,i)=>tone(f,f*.98,.35,.07,'triangle',i*.18))}

let G=[],N=12,units=[],S={},M=null,TERMS=[];
const tileAt=(x,z)=>x>=0&&z>=0&&x<N&&z<N?G[z][x]:null;
const topY=t=>t.type==='water'?-.3:t.h*.5;
const W=(x,z)=>new THREE.Vector3(x-(N-1)/2,0,z-(N-1)/2);
const cheb=(a,b)=>Math.max(Math.abs(a.x-b.x),Math.abs(a.z-b.z));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
const squad=()=>units.filter(u=>u.team==='p'&&u.op);
const living=team=>units.filter(u=>u.team===team&&!u.down&&!u.gone);
const foes=()=>living('e').filter(u=>u.cls!=='turret');
const unitAt=(x,z,ign)=>units.find(u=>u!==ign&&!u.gone&&u.x===x&&u.z===z&&!(u.down&&u.team==='e'));

function parseMap(rows){N=rows.length;G=[];TERMS=[];const spawns=[],zone=[],exits=[];let item=null;const cps=[];
  for(let z=0;z<N;z++){G.push([]);for(let x=0;x<N;x++){const ch=rows[z][x],t={x,z,h:0,type:'floor',obj:null};
    if('^ctvhs'.includes(ch))t.h=1;if(ch==='~')t.type='water';if(ch==='/'){t.type='ramp';t.h=.5}
    if(ch==='C'||ch==='c')t.obj='crate';if(ch==='w'||ch==='v')t.obj='wall';if(ch==='X')t.obj='pillar';if(ch==='T'||ch==='t'){t.obj='term';TERMS.push(t)}
    if('HhSs'.includes(ch)){t.cp=(ch==='H'||ch==='h')?'health':'supply';t.owner=null;cps.push(t)}
    if(ch==='P'||ch==='Q')spawns.push(t);if(ch==='Z'||ch==='Q'){t.zone=true;zone.push(t)}if(ch==='E'){t.exit=true;exits.push(t)}if(ch==='I'){t.item=true;item=t}
    G[z].push(t)}}

  if(A.tgt==='ally')for(const p of living('p').concat(squad().filter(q=>q.down))){if(p.cls==='turret')continue;if(id==='adrenaline'&&(p===u||!p.moved||p.down))continue;
    if(id==='patch'&&!(p.down||p.hp<p.maxHp))continue;if(id==='resupply'&&p===u)continue;if((A.range===1?cheb(u,p)<=1:dist(u,p)<=A.range))out.push(G[p.z][p.x])}
  if(A.tgt==='enemy')for(const e of living('e'))if(e.seen&&hitChance(u,e)>0)out.push(G[e.z][e.x]);
  if(A.tgt==='build')for(const[dx,dz]of D4){const t=tileAt(u.x+dx,u.z+dz);if(t&&t.type!=='water'&&!t.obj&&!t.cp&&!unitAt(t.x,t.z))out.push(t)}

    if(u.team==='p'){computeVis();if(t.item&&!S.carrier&&S.item===t){S.carrier=u;u.carry=true;t.item=false;updBar(u);popup(u,'Cartridge','good');log(`${u.name} has the cartridge. Get to the exit!`);attachCarry(u)}

function muzzle(u){const v=u.group.position.clone();v.y+=u.cls==='turret'?.5:u.body==='heavy'?.62:.58;v.x+=Math.sin(u.group.rotation.y)*.34;v.z+=Math.cos(u.group.rotation.y)*.34;return v}

async function shoot(a,b,mod=0){await face(a,b.x,b.z);const c=hitChance(a,b,mod),n=a.weapon.burst||1,fl=b.cls!=='turret'&&coverOf(G[b.z][b.x],G[a.z][a.x])===0;let dmg=0,hits=0;

async function turretsFire(team){for(const tu of units.filter(x=>x.cls==='turret'&&x.team===team&&!x.down&&!x.gone)){if(tu.stun>0){tu.stun--;continue}
  let best=null;for(const v of living(team==='p'?'e':'p')){if(v.cls==='turret')continue;if(team==='p'&&!v.seen)continue;if(team==='e'&&v.disg>0&&cheb(v,tu)>1)continue;const c=hitChance(tu,v);if(c&&(!best||c>best.c))best={v,c}}
  if(best&&(team==='p'||S.alerted)){if(team==='e')focus(tu);await shoot(tu,best.v);if(checkEnd())return}}}
function startTurnEffects(team){for(const t of S.info.cps){if(t.owner!==team)continue;for(const v of living(team)){if(v.cls==='turret')continue;
    if(t.cp==='health'&&v.hp<v.maxHp){v.hp=Math.min(v.maxHp,v.hp+10);updBar(v)}if(t.cp==='supply')for(const k in v.cd)v.cd[k]=Math.max(0,v.cd[k]-1)}}
  for(const v of units.filter(x=>x.team===team&&!x.gone)){for(const k in v.cd)v.cd[k]=Math.max(0,v.cd[k]-1);v.ow=false;if(v.disg>0)v.disg--;v.moved=v.acted=false;if(v.stun>0&&v.cls!=='turret'){v.moved=v.acted=true;v.stun--}updBar(v)}}
async function endPlayerTurn(){S.undo=null;S.phase='enemy';S.sel=null;S.mode=null;refresh();await turretsFire('p');if(checkEnd()||advanceObj())return;await enemyTurn()}
async function enemyTurn(){banner('Enemy turn','enemy');await sleep(800);startTurnEffects('e');
  for(const[t,list]of(M.reinf||[]))if(t===S.turn){let any=false;for(const[type,x,z]of list){if(unitAt(x,z)||G[z][x].obj)continue;const e=spawnEnemy(type,x,z,S.R);e.fresh=true;any=true}if(any){log('Enemy reinforcements have arrived');S.alerted=true;applyFog();await sleep(500)}}
  for(const e of [...living('e')]){if(S.over)return;if(e.fresh){e.fresh=false;continue}if(e.cls==='turret')continue;if(e.moved&&e.acted)continue;await aiAct(e);updBar(e);if(checkEnd())return;if(S.over)return}
  await turretsFire('e');if(checkEnd())return;
  const o=curObj();if(o&&o.type==='hold'&&squad().some(p=>!p.down&&G[p.z][p.x].zone)){S.hold++;log(`Square held (${S.hold}/${o.turns})`)}
  if(advanceObj())return;
  S.turn++;S.reveals=S.reveals.filter(r=>--r.turns>0);startTurnEffects('p');S.phase='player';computeVis();banner('Your turn');

function knownTargets(e){return living('p').filter(p=>p.cls==='turret'||!(p.disg>0)||cheb(p,e)<=1)}

async function aiAct(e){

    else{const b=bestShot(e);if(b)await shoot(e,b.t)}return}

    if(hurt){const r=reach(e);let spot=null;for(const k of r.d.keys()){const[x,z]=k.split(',').map(Number);if(Math.max(Math.abs(x-hurt.x),Math.abs(z-hurt.z))<=1){spot=[x,z];break}}
      if(spot){await moveAlong(e,pathTo(r,spot[0],spot[1]));if(e.down)return;await face(e,hurt.x,hurt.z);hurt.hp=Math.min(hurt.maxHp,hurt.hp+35);updBar(hurt);if(hurt.seen)popup(hurt,'+35','good');return}}}
  if(e.cls==='engineer'&&!e.built){const spots=D4.map(([dx,dz])=>tileAt(e.x+dx,e.z+dz)).filter(t=>t&&t.type!=='water'&&!t.obj&&!t.cp&&!unitAt(t.x,t.z));if(spots.length&&bestShot(e)){const t=spots[0];e.built=true;const tu=spawnEnemy('turret',t.x,t.z,S.R);tu.fresh=false;tu.moved=tu.acted=true;applyFog();if(tu.seen)log('An enemy engineer deployed a turret');return}}

  if(b&&b.c>=thr){await shoot(e,b.t);return}

    let cov=2;for(const t of ps)cov=Math.min(cov,coverOf(G[z][x],G[t.z][t.x]));const near=Math.min(...ps.map(t=>dist(e,t)));const tl=G[z][x];
    let sc=shot+cov*18+(tl.h>=1?6:0)+Math.random()*4;sc+=e.type==='marksman'?Math.min(near,7)*1.2:e.type==='infiltrator'?flank*22-near*2:-near*1.6;
    if(tl.cp&&tl.owner!=='e')sc+=14;if(tl.zone&&curObj()&&curObj().type==='hold')sc+=10;const ct=S.carrier;if(ct)sc-=dist({x,z},ct)*1.5;sc+=objectiveGuard(x,z);
    if(sc>bs){bs=sc;pick=[x,z]}}
  e.x=ox;e.z=oz;if(pick&&!(pick[0]===ox&&pick[1]===oz))await moveAlong(e,pathTo(r,pick[0],pick[1]));if(e.down)return;
  b=bestShot(e);if(b&&b.c>=25)await shoot(e,b.t);else if(coverOf(G[e.z][e.x],G[ps[0].z][ps[0].x])>=1){e.ow=true;updBar(e)}}
function objectiveGuard(x,z){const o=curObj();if(!o||!o.targets)return 0;let s=0;for(const[tx,tz]of o.targets)if((S.prog[key(tx,tz)]||0)<o.need)s-=Math.hypot(tx-x,tz-z)*.6;return s}

/* ---------- end ---------- */
function checkEnd(){if(S.over)return true;if(!squad().some(p=>!p.down)){endMission(false,'The whole squad is down.');return true}return false}
function endMission(won,why){if(S.over)return;S.over=true;S.phase='over';applyFog();refresh();
  const f=CUR.faction,m=M,res=[];let recruit=null;
  for(const u of squad()){const op=SAVE.roster[f].find(o=>o.id===u.op.id);if(!op)continue;const before=lvlOf(op.xp);
    let xp=won?m.xp:25;xp+=u.kills*15+(S.credit[op.id]||0)*25;if(won&&S.info.cps.length&&S.info.cps.every(t=>t.owner==='p'))xp+=20;
    op.xp+=xp;const after=lvlOf(op.xp);if(won&&u.down)op.injured=2;res.push({op,xp,before,after,kills:u.kills,down:u.down})}

function viewDebrief(won,why,res,recruit,sm){const f=CUR.faction,m=M;

  <div class="dlist">${res.map(r=>{const l=r.after,nx=LEVELS[l]||null,pr=nx?Math.round((r.op.xp-LEVELS[l-1])/(nx-LEVELS[l-1])*100):100;const unl=[];for(let L=r.before+1;L<=r.after;L++){CLASS_AB[r.op.cls].forEach((a,i)=>{if(AB_LVL[i]===L)unl.push(AB[a].name)});if(L===3)unl.push('+1 move')}
    return `<div class="dcard"><div class="pf">${portrait(r.op.look,'d'+r.op.id)}</div><div class="oc"><b>${esc(r.op.name)} <i>Lv ${l}</i></b><span>+${r.xp} XP${r.kills?`, ${r.kills} kill${r.kills>1?'s':''}`:''}${r.down&&won?', injured':''}</span><div class="xp"><s style="width:${pr}%"></s></div>${r.after>r.before?`<p class="lvup">Level up!${unl.length?' Unlocked '+unl.join(', '):''}</p>`:''}</div></div>`}).join('')}</div>

  ${won&&SAVE.prog[f]>=4&&CUR.mi===3?`<div class="epi"><b>Campaign complete</b><p>${EPILOGUE[f]}</p></div>`:''}
  <div class="row"><button type="button" class="go" id="cont">Continue</button>${won?'':'<button type="button" class="btn" id="retry">Retry mission</button>'}</div>`;
  $('#cont').onclick=viewCamp;if(!won)$('#retry').onclick=viewBrief;show('debrief')}

/* ---------- input + loop ---------- */
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
function pickAt(cx,cy){const r=renderer.domElement.getBoundingClientRect();mv.set((cx-r.left)/r.width*2-1,-(cy-r.top)/r.height*2+1);ray.setFromCamera(mv,cam);
  let first=null;for(const h of ray.intersectObjects(scene.children,true)){const ud=h.object.userData;if(!h.object.visible)continue;if(ud.unit&&!ud.unit.gone&&(ud.unit.team==='p'||ud.unit.seen))return{unit:ud.unit};if(ud.tile&&h.object.parent===hl)return{tile:ud.tile};if(ud.tile&&!first)first=ud.tile}return first?{tile:first}:{}}
function zoomCam(f){camState.zoom=Math.max(.55,Math.min(2.4,camState.zoom*f))}
function rotateCam(d){const from=camState.angle,to=from+d*Math.PI/2;tween(320,k=>camState.angle=from+(to-from)*ease(k))}
const setCtl=()=>{$('#spd').textContent=SAVE.settings.fast?'2×':'1×';$('#snd').textContent=SAVE.settings.sound?'🔊':'🔇'};
$('#spd').onclick=()=>{SAVE.settings.fast=!SAVE.settings.fast;SPD=SAVE.settings.fast?.55:1;persist();setCtl()};
$('#snd').onclick=()=>{SAVE.settings.sound=!SAVE.settings.sound;persist();setCtl();sfx('ui')};setCtl();
$('#rotL').onclick=()=>rotateCam(-1);$('#rotR').onclick=()=>rotateCam(1);$('#zin').onclick=()=>zoomCam(1.2);$('#zout').onclick=()=>zoomCam(1/1.2);
function bindInput(){const cv=renderer.domElement,ptrs=new Map();let drag=null,pinch=null;
